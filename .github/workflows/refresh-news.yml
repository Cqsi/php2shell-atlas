name: Refresh incident coverage

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-incident-coverage
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run refresh-news
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- data/live-news.json; then exit 0; fi
          git config user.name 'Casimir Rönnlöf'
          git config user.email '40036806+Cqsi@users.noreply.github.com'
          git add data/live-news.json
          git commit -m 'Refresh incident coverage'
          git push
